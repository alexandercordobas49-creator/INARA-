name: INARA CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/postgresql-single-source

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build --workspace frontend
      - name: Run backend tests
        run: npm run test --workspace backend -- --run
